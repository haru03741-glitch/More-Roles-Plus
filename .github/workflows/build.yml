name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native:
    name: Native parts (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # C++ の部品 (native/src) を MSVC で組む。本体の MoreRolesPlus.dll に埋め込まれる
      - name: Build MrpNative.dll
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-native.ps1 -SkipAndroid
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload MrpNative.dll
        uses: actions/upload-artifact@v4
        with:
          name: MrpNative-${{ github.sha }}
          path: build/native/win-x64/MrpNative.dll
          retention-days: 30
          if-no-files-found: error

  build:
    name: Release build + checks (PC only)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # C++ の部品は本体に埋め込むので、先に組んだ物をビルドの前に置く
      - uses: actions/download-artifact@v4
        with:
          name: MrpNative-${{ github.sha }}
          path: build/native/win-x64

      # SDK は global.json (10.0) に固定。net6.0 の参照アセンブリも要る
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Restore
        run: dotnet restore MoreRolesPlus.csproj

      # Release ビルド (ゲームへは配置しない)。Android のビルドは端末のローダーが生成した参照先が要るので CI では回らない
      - name: Release build
        run: dotnet build MoreRolesPlus.csproj -c Release --no-restore -p:MrpNoDeploy=true -v:q -nologo

      - name: Upload MoreRolesPlus.dll
        uses: actions/upload-artifact@v4
        with:
          name: MoreRolesPlus-${{ github.sha }}
          path: bin/Release/net6.0/MoreRolesPlus.dll
          retention-days: 30
          if-no-files-found: error
